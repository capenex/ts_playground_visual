name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build bundles
        run: npm run build:editor
      - name: Typecheck modular TypeScript
        run: npx tsc --noEmit
      - name: Run pipeline tests
        run: node test-pipeline.mjs
      - name: Build portable dist
        run: npm run build

